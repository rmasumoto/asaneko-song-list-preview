<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>あさねこ 歌える曲リスト｜プレビュー</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="songs.js"></script>
  <script defer src="song-list.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="icon-definitions">
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-gift" viewBox="0 0 24 24"><path d="M3 11h18V7H3zM5 11v9h14v-9M12 7v13M12 7H8a2.3 2.3 0 1 1 2.1-3.3L12 7Zm0 0h4a2.3 2.3 0 1 0-2.1-3.3L12 7Z"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M9 4.5 21 2v14.3c0 2.3-2.6 3.8-4.7 3.2-2.8-.8-2-4.3.5-5.1a6 6 0 0 1 2.2-.2V6.1l-8 1.8v11.4c0 2.3-2.6 3.8-4.7 3.2-2.8-.8-2-4.3.5-5.1a6 6 0 0 1 2.2-.2z"/></symbol>
<symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 2c0 6-4 10-10 10 6 0 10 4 10 10 0-6 4-10 10-10-6 0-10-4-10-10ZM20 2v5m-2.5-2.5h5M4 17v5m-2.5-2.5h5"/></symbol>
<symbol id="i-tag" viewBox="0 0 24 24"><path d="M10 3 6 21M18 3l-4 18M3 9h18M2 15h18"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="7" width="12" height="14" rx="2"/><path d="M16 4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 5v6h6M4 10a8 8 0 1 1 1 8"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2 6h3c5 0 7 12 12 12h4m-4-4 4 4-4 4M2 18h3c5 0 7-12 12-12h4m-4-4 4 4-4 4"/></symbol>
</svg>
  <div class="backdrop" aria-hidden="true"></div>
  <header class="hero wrap">
    <p class="brand"><span aria-hidden="true">✦</span> <span class="brand-name">あさねこ</span> <span aria-hidden="true">✦</span></p>
    <div class="hero-title">
      <img src="assets/cat.svg" alt="" class="cat">
      <h1>歌える曲リスト</h1>
    </div>
    <p class="intro">曲名・アーティスト名で検索したり、条件で絞り込めます</p>
  </header>
  <main class="wrap">
    <section class="search-panel" aria-label="曲を探す">
      <form class="search" role="search">
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <label class="visually-hidden" for="query">曲名・アーティストで検索</label>
        <input id="query" type="search" placeholder="曲名・アーティスト名を入力" autocomplete="off">
        <button type="submit" class="gradient" aria-label="検索"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg></button>
      </form>
      <div id="filter-menu" class="filter-menu"></div>
      <div id="filter-options"></div>
    </section>
    <section aria-label="曲一覧">
      <div class="results-bar">
        <div class="result-count">検索結果 <output id="count" aria-live="polite">0</output> 件</div>
        <div class="results-actions">
          <label for="sort">並び順</label>
          <select id="sort">
            <option value="title">曲名（あ→わ）</option>
            <option value="source">リスト順</option>
            <option value="gift">ギフト順</option>
          </select>
          <button id="reset" type="button"><svg class="icon" aria-hidden="true"><use href="#i-reset"></use></svg>リセット</button>
        </div>
      </div>
      <ul id="songs" class="songs"></ul>
      <p id="empty" class="empty" hidden>条件に一致する曲が見つかりませんでした。</p>
      <div id="sentinel" aria-hidden="true"></div>
      <noscript>曲を検索するにはJavaScriptを有効にしてください。</noscript>
    </section>
    <details class="rules" open>
      <summary>リクエストのご案内</summary>
      <p>ギフト表示はNotion版のイベント時の案内をもとにしています。リクエスト条件は配信中の案内をご確認ください。</p>
      <p>プレビュー用の562曲はNotionの画像から読み取ったデータです。</p>
    </details>
  </main>
  <div class="random-dock">
    <button id="random" class="gradient" type="button"><svg class="icon" aria-hidden="true"><use href="#i-shuffle"></use></svg>ランダムで1曲選ぶ <span aria-hidden="true">✦</span></button>
  </div>
  <dialog id="random-result">
    <form method="dialog"><button type="submit" aria-label="閉じる">×</button></form>
    <p>選ばれた曲</p>
    <div id="selected-song"></div>
  </dialog>
  <div id="feedback" class="feedback" role="status" hidden></div>
</body>
</html>
